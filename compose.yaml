services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beaconops-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Configure DATABASE_URL_DOCKER no arquivo .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"